services:
  backend:
    build: ./backend
    container_name: travel_backend
    volumes:
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_IMG_BASE: ${NEXT_PUBLIC_IMG_BASE}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: travel_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    # ลบ volumes โค้ดออกเพื่อให้ใช้ไฟล์จากการ Build ใน Dockerfile
    depends_on:
      - backend

  db:
    image: postgres
    container_name: travel_postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  nginx:
    image: nginx:alpine
    container_name: travel_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/media:/app/media
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
